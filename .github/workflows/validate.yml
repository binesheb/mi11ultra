name: Validate

on:
  push:
    branches: [main]
    paths:
      - "flash_tool"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "flash_tool"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate C# source safety invariants
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path("flash_tool").read_text(encoding="utf-8")
          required = [
              "namespace Mi11UltraFlashingApp",
              "public partial class Form1",
              "fastboot flash boot",
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f"Missing expected source markers: {missing}")
          if source.count("{") != source.count("}"):
              raise SystemExit("Unbalanced C# braces in flash_tool")

          # Ignore C# line comments when checking active safety-sensitive commands.
          # The source intentionally documents disabled commands in comments.
          active_source = re.sub(r"//.*$", "", source, flags=re.MULTILINE)
          if "fastboot flash system" in active_source:
              raise SystemExit("Unsupported system partition flashing detected")
          if 'fastboot flash boot "' not in active_source:
              raise SystemExit("Boot flashing command must keep the selected path quoted")
          if 'if (confirm == DialogResult.Yes)' not in active_source:
              raise SystemExit("Boot flashing must remain behind explicit confirmation")
          print("flash_tool safety validation passed")
          PY
